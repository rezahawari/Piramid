services:
  # App container — dipakai untuk deploy (Dokploy) atau uji image lokal.
  # Untuk dev lokal sehari-hari cukup `php artisan serve` + service postgres.
  app:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:80"
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:-http://localhost:4000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-qurban_pyramid}
      DB_USERNAME: ${DB_USERNAME:-qurban_app}
      DB_PASSWORD: ${DB_PASSWORD:-qurban_dev_secret}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qurban_pyramid}
      POSTGRES_USER: ${DB_USERNAME:-qurban_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qurban_dev_secret}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qurban_app} -d ${DB_DATABASE:-qurban_pyramid}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
