<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - Piramid Qurban & Aqiqah</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f9fafb; color: #1f2937; padding: 20px; text-align: center; }
        .card { max-width: 400px; background: white; padding: 32px 24px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        .icon { width: 64px; height: 64px; margin: 0 auto 16px; color: #6a1918; }
        h1 { font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 8px; }
        p { font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
        button { background-color: #6a1918; color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #531211; }
    </style>
</head>
<body>
    <div class="card">
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21M8.464 15.536a5 5 0 010-7.072m0 0l2.829 2.829" />
        </svg>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda sedang terputus. Pastikan data seluler atau Wi-Fi Anda aktif lalu coba lagi.</p>
        <button onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
